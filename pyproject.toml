[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gakoway"
version = "0.0.1"
dependencies = [
    "Flask>=3.1",
    "gunicorn>=24.1",
]

[tool.setuptools]
# test fixture packages (integration_tests, arg_test) are not part of the distribution
py-modules = ["gateway", "cli"]
packages = []
